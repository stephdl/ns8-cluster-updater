name: release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck ns8-cluster-updater.sh
      - name: Stamp the version into the script
        run: |
          sed -i "s/^VERSION=dev$/VERSION=${GITHUB_REF_NAME}/" ns8-cluster-updater.sh
          grep -qx "VERSION=${GITHUB_REF_NAME}" ns8-cluster-updater.sh
      - run: sha256sum ns8-cluster-updater.sh ns8-cluster-updater.service ns8-cluster-updater.timer > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(ns8-cluster-updater.sh ns8-cluster-updater.service ns8-cluster-updater.timer SHA256SUMS)
          # A release created from the GitHub UI already exists: attach the files to it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "${files[@]}"
          fi
      - name: Point the README install URL to this release
        run: |
          # Drop the stamped script: only the README goes to main.
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s#(releases/download/)[^/[:space:]]+#\1${GITHUB_REF_NAME}#" README.md
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: install ${GITHUB_REF_NAME}" README.md
          git push origin main
