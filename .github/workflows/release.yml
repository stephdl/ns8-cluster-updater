name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck ns8-cluster-updater.sh
      - name: Stamp the version into the script
        run: |
          sed -i "s/^VERSION=dev$/VERSION=${GITHUB_REF_NAME}/" ns8-cluster-updater.sh
          grep -qx "VERSION=${GITHUB_REF_NAME}" ns8-cluster-updater.sh
      - run: sha256sum ns8-cluster-updater.sh ns8-cluster-updater.service ns8-cluster-updater.timer > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            ns8-cluster-updater.sh ns8-cluster-updater.service ns8-cluster-updater.timer SHA256SUMS
